name: Update Actualités RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install feedparser requests
      
      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites.xml actualites-discord.xml football.xml football-discord.xml actions.xml actions-discord.xml finance.xml finance-discord.xml crypto.xml crypto-discord.xml
          git diff --cached --quiet || git commit -m "Update actualités RSS"
          git push
